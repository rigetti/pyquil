name: Publish pyQuil

# This is the only workflow that uploads to PyPI, and it is always invoked at a
# pinned `@master` ref so that the checks below come from master rather than
# from whatever branch dispatched the run.
#
# PyPI trusted publishing matches on the *entry-point* workflow (release.yml)
# and on the environment names used here. Renaming either stops publishing
# until the publisher is updated:
#   https://pypi.org/manage/project/pyquil/settings/publishing/

on:
  workflow_call:
    inputs:
      version:
        description: "Version being published, without a leading v."
        required: true
        type: string
      is-prerelease:
        description: "Publish through the ungated environment."
        required: true
        type: boolean
      dev-build:
        description: >
          Publish a derived .devN version that is not committed anywhere. The
          only thing publishable from a branch other than master.
        required: false
        type: boolean
        default: false
      publish-docker:
        required: false
        type: boolean
        default: true
      publish-grpc-web:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "Existing released version to re-publish, without a leading v (e.g. 4.19.0)"
        required: true
        type: string
      is-prerelease:
        description: "The version being re-published is an rc."
        required: false
        type: boolean
        default: false
      publish-docker:
        required: false
        type: boolean
        default: true
      publish-grpc-web:
        required: false
        type: boolean
        default: true

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ (inputs.dev-build || inputs.is-prerelease) && 'pypi-rc-or-dev' || 'pypi-release' }}
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        ref: v${{ inputs.version }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: snok/install-poetry@v1
      with:
        virtualenvs-in-project: true

    # Inlined rather than delegated to scripts/, because the checked-out tree
    # belongs to the ref being published and a branch could edit a script. This
    # file comes from master; the code below cannot be tampered with by a branch.
    - name: "Verify this version may be published from this ref"
      env:
        VERSION: ${{ inputs.version }}
        DEV_BUILD: ${{ inputs.dev-build }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        pip install --quiet packaging
        python - <<'EOF'
        import os, re, subprocess, sys
        from packaging.version import Version

        version = os.environ["VERSION"]
        dev_build = os.environ["DEV_BUILD"] == "true"
        ref = os.environ["REF"]

        def die(message):
            sys.exit(f"::error::{message}")

        if dev_build:
            # A dev build is the only thing publishable from a branch, and it may
            # only ever be a .devN. Anything else is an attempt to release from a
            # branch and is refused regardless of what the caller asked for.
            if not re.fullmatch(r"\d+\.\d+\.\d+\.dev\d+", version):
                die(f"refusing to publish {version!r} as a development build")
        else:
            if ref != "refs/heads/master":
                die(f"refusing to publish release {version} from {ref}; releases come from master")
            packaged = subprocess.check_output(["poetry", "version", "--short"], text=True).strip()
            if Version(packaged) != Version(version):
                die(f"tag v{version} does not match the version in pyproject.toml ({packaged})")
            if os.environ["EVENT"] == "workflow_dispatch":
                # Re-publishing an existing tag: make sure it is a tag on master
                # and not one left behind on a branch.
                if subprocess.run(
                    ["git", "merge-base", "--is-ancestor", f"v{version}", "origin/master"]
                ).returncode != 0:
                    die(f"v{version} is not an ancestor of master")
        print(f"ok: publishing {version} from {ref}")
        EOF

    # Dev versions are never committed: the tag points at the branch commit, whose
    # pyproject.toml still holds the last released version. Applied in the runner's
    # tree only, after the check above has confirmed the shape.
    - name: "Apply the derived development version"
      if: ${{ inputs.dev-build }}
      run: poetry version "${{ inputs.version }}"

    - name: "Build"
      run: |
        poetry build --no-interaction
    - name: "Publish"
      uses: pypa/gh-action-pypi-publish@release/v1

    - id: publish
      name: "Compute image tags"
      env:
        PYQUIL_TAG_VERSION: ${{ inputs.version }}
      run: |
        export PYQUIL_TAG_LATEST=$([[ "$PYQUIL_TAG_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] && echo latest || echo)
        export PYQUIL_TAG_RC=$([[ "$PYQUIL_TAG_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+-?rc[.]?[0-9]+$ ]] && echo rc || echo)
        echo "PYQUIL_TAG_VERSION=$PYQUIL_TAG_VERSION" >> "$GITHUB_OUTPUT"
        echo "PYQUIL_TAG_LATEST=$PYQUIL_TAG_LATEST" >> "$GITHUB_OUTPUT"
        echo "PYQUIL_TAG_RC=$PYQUIL_TAG_RC" >> "$GITHUB_OUTPUT"
    outputs:
      PYQUIL_TAG_VERSION: ${{ steps.publish.outputs.PYQUIL_TAG_VERSION }}
      PYQUIL_TAG_LATEST: ${{ steps.publish.outputs.PYQUIL_TAG_LATEST }}
      PYQUIL_TAG_RC: ${{ steps.publish.outputs.PYQUIL_TAG_RC }}

  build-publish-grpc-web:
    name: Build and Publish (pyquil-grpc-web)
    if: ${{ inputs.publish-grpc-web }}
    runs-on: ubuntu-latest
    # Must share the gate with build-publish: without it this job would upload
    # while the main package is still waiting for approval.
    environment:
      name: ${{ (inputs.dev-build || inputs.is-prerelease) && 'pypi-rc-or-dev' || 'pypi-release' }}
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        ref: v${{ inputs.version }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: snok/install-poetry@v1
      with:
        virtualenvs-in-project: true
    - name: Patch package metadata for grpc-web
      run: |
        pip install toml
        python scripts/ci_publish_grpc_web.py
    - name: Poetry Build
      run: |
        poetry build --no-interaction
    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: dist
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1

  docker-publish:
    name: Docker Publish
    if: ${{ inputs.publish-docker }}
    runs-on: ubuntu-latest
    needs: build-publish
    env:
      PYQUIL_TAG_VERSION: ${{ needs.build-publish.outputs.PYQUIL_TAG_VERSION }}
      PYQUIL_TAG_LATEST: ${{ needs.build-publish.outputs.PYQUIL_TAG_LATEST }}
      PYQUIL_TAG_RC: ${{ needs.build-publish.outputs.PYQUIL_TAG_RC }}
    steps:
      # Determine the tags to publish based on the release tag
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PYQUIL_TAG_VERSION }}
            type=raw,value=${{ env.PYQUIL_TAG_LATEST }},enable=${{ env.PYQUIL_TAG_LATEST != '' }}
            type=raw,value=${{ env.PYQUIL_TAG_RC }},enable=${{ env.PYQUIL_TAG_RC != '' }}
      # Checkout is needed to use the path context: .
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - name: Build and Test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: "${{ vars.DOCKER_IMAGE_NAME }}:test"
          build-args: |
            pyquil_version=${{ env.PYQUIL_TAG_VERSION }}
      - name: Test Image
        run: |
          docker run --rm "${{ vars.DOCKER_IMAGE_NAME }}:test" python -c "from pyquil import get_qc"
      # Build and publish the image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            pyquil_version=${{ env.PYQUIL_TAG_VERSION }}
