[project]
name = "pyquil"
version = "5.0.0-rc.3"
requires-python = ">=3.10,<4"
description = "A Python library for creating Quantum Instruction Language (Quil) programs."
authors = [{ name = "Rigetti Computing", email ="softapps@rigetti.com" }]
readme = "README.md"
repository = "https://github.com/rigetti/pyquil.git"
documentation = "https://pyquil-docs.rigetti.com"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
keywords = ["quantum", "quil", "programming", "hybrid"]

dependencies = [
  "numpy (>=1.26,<3.0)",
  "scipy (>=1.11,<2.0)",
  "rpcq (>=3.11.0,<4.0.0)",
  "networkx (>=2.5)",
  "qcs-sdk-python (>=0.26.0rc0,<0.27.0)",
  "quil (>=0.35.0,<0.36.0)",
  "packaging (>=26.0,<27.0)",
  "deprecated (>=1.2.14,<2.0.0)",
  "types-deprecated (>=1.2.9.3,<2.0.0.0)",
]

[project.optional-dependencies]
latex = ["ipython (>=8.16.0,<9.0.0)"]
docs = [
  "Sphinx (>=7.3.7,<8.0.0)",
  "sphinx-rtd-theme (>=1.3.0,<=2.0.0)",
  "nbsphinx (>=0.9.3,<0.10.0)",
  "myst-parser (>=3.0.1,<4.0.0)",
  "pandoc (>=2.4b0,<3.0)",
  "matplotlib (>=3.9.0,<4.0.0)",
  "matplotlib-inline (>=0.1.7,<0.2.0)",
  "seaborn (>=0.13.2,<0.14.0)",
  "toml (>=0.10.2,<0.11.0)",
]

[dependency-groups]
dev = [
  "typing-extensions (>=4.12.0,<5.0.0)",
  "setuptools (>=78.0.0,<79.0.0) ; python_version >= '3.12'",
  "ruff (>=0.4.6,<0.5.0)",
  "pytest (>=8.2.0,<9.0.0)",
  "pytest-cov (>=5.0.0,<6.0.0)",
  "mypy (>=1.10.0,<2.0.0)",
  "toml (>=0.10.2,<0.11.0)",
  "pytest-xdist (>=3.6.1,<4.0.0)",
  "pytest-rerunfailures (>=14.0.0,<15.0.0)",
  "pytest-timeout (>=2.3.1,<3.0.0)",
  "pytest-mock (>=3.14.0,<4.0.0)",
  "pytest-benchmark (>=4.0.0,<5.0.0)",
  "respx (>=0.21.1,<0.22.0)",
  "syrupy (>=4.6.1,<5.0.0)",
  "jinja2 (>=3.1.6,<4.0.0)",
  "h11 (>=0.16.0,<0.17.0)",
]

[tool.poetry]
packages = [{ include = "pyquil" }]

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev-template]
optional = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["D", "E4", "E7", "E9", "F", "I", "B", "S", "UP", "W", "NPY201"]
ignore = [
  "D105",  # Allow missing documentation in dunder method.
  "D203",  # This conflicts with D211.
  "D213",  # This conflicts with D212.
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = [
    "D",    # docstrings are not enforced in tests
    "S101", # asserts are allowed in tests
    "S301", # we only deserialize our own data to ensure compatibility with the pickle module
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:pyquil.*:", "ignore::DeprecationWarning:test.unit.*:"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
